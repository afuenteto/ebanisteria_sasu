<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Ebanistería SASU</title><style>
:root{--bg:#f1eee8;--card:#fbfaf7;--ink:#191917;--muted:#77746c;--line:#ddd8ce;--hero:#1b1b18;--heroText:#fff;--radius:28px;--font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;--texture:none;--textureSize:cover;--textureX:50%;--textureY:50%;--textureOpacity:.9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font)}main{max-width:560px;margin:auto;padding:20px 18px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.brand{font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.sub{font-size:12px;color:var(--muted);margin-top:4px}.gear{border:0;background:var(--card);width:42px;height:42px;border-radius:50%;font-size:18px}.custom{display:none;margin-bottom:16px}.custom.open{display:block}.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:17px}.panel h2{font-size:13px;margin:0 0 15px;text-transform:uppercase;letter-spacing:.1em}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}.field input[type=text],.field input[type=number],select{width:100%;border:1px solid var(--line);background:#f6f4ef;border-radius:11px;padding:11px;font-size:15px}.color{width:100%;height:42px;border:1px solid var(--line);border-radius:11px;padding:3px;background:#f6f4ef}.upload{display:block;border:1px dashed #bcb6aa;border-radius:12px;padding:12px;text-align:center;font-size:13px;color:var(--muted);margin-top:8px}.upload input{display:none}.textureName{font-size:11px;color:var(--muted);margin-top:6px}.check{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-top:10px}.reset{border:0;background:#e7e3db;padding:11px 14px;border-radius:11px;font-size:12px;margin-top:12px}.textureControls{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}.hero{position:relative;overflow:hidden;background:var(--hero);color:var(--heroText);border-radius:var(--radius);padding:27px 22px 24px;box-shadow:0 12px 30px #0002}.hero:before{content:"";position:absolute;inset:0;background-image:var(--texture);background-size:var(--textureSize);background-position:var(--textureX) var(--textureY);background-repeat:no-repeat;opacity:var(--textureOpacity);pointer-events:none}.hero>*{position:relative}.eyebrow{font-size:12px;color:#aaa;text-transform:uppercase;letter-spacing:.12em}.hoursrow{display:flex;align-items:center;gap:9px;margin-top:6px}.hours{width:100%;background:transparent;border:0;color:inherit;font-size:58px;font-weight:600;outline:0}.unit{font-size:16px;color:#aaa}.slider{width:100%;accent-color:#fff;margin:13px 0 20px}.result{border-top:1px solid #ffffff30;padding-top:19px}.resultlabel{font-size:12px;color:#aaa}.price{font-size:42px;font-weight:700;margin:5px 0}.rate{font-size:13px;color:#aaa}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:15px}.q{border:1px solid #ffffff35;background:#ffffff12;color:#eee;border-radius:11px;padding:9px 3px;font-size:12px}.section{margin-top:18px}.sectiontitle{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 9px 4px}.total{display:flex;justify-content:space-between;align-items:end;margin-top:14px;padding-top:15px;border-top:1px solid var(--line)}.total span{font-size:13px;color:var(--muted)}.total strong{font-size:28px}.note{text-align:center;color:var(--muted);font-size:11px;margin-top:18px}
</style></head><body><main>
<header class="top"><div><div class="brand" id="brand">Ebanistería SASU</div><div class="sub" id="subtitle">Calculadora de presupuestos</div></div><button class="gear" onclick="toggleCustom()">⚙︎</button></header>
<section id="custom" class="custom"><div class="panel"><h2>Personalización visual</h2><div class="grid">
<div class="field"><label>Nombre / cabecera</label><input id="brandIn" type="text" value="Ebanistería SASU"></div><div class="field"><label>Subtítulo</label><input id="subIn" type="text" value="Calculadora de presupuestos"></div>
<div class="field"><label>Fondo general</label><input id="bgIn" class="color" type="color" value="#f1eee8"></div><div class="field"><label>Fondo tarjetas</label><input id="cardIn" class="color" type="color" value="#fbfaf7"></div>
<div class="field"><label>Color texto</label><input id="inkIn" class="color" type="color" value="#191917"></div><div class="field"><label>Color zona principal</label><input id="heroIn" class="color" type="color" value="#1b1b18"></div>
<div class="field"><label>Texto zona principal</label><input id="heroTextIn" class="color" type="color" value="#ffffff"></div><div class="field"><label>Radio esquinas</label><input id="radiusIn" type="number" min="8" max="50" value="28"></div>
<div class="field"><label>Tipografía</label><select id="fontIn"><option value='-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif'>Apple / SF Pro</option><option value="Arial,sans-serif">Arial</option><option value="Georgia,serif">Georgia</option><option value="Verdana,sans-serif">Verdana</option></select></div><div class="field"><label>Tamaño cabecera</label><input id="sizeIn" type="number" min="10" max="30" value="14"></div></div>
<div class="field" style="margin-top:14px"><label>Textura para la zona principal</label><label class="upload">＋ Subir textura de madera de roble<input id="texture" type="file" accept=".jpg,.jpeg,.png,image/jpeg,image/png"></label><div id="textureName" class="textureName">No hay textura cargada</div><label class="check"><input id="textureUse" type="checkbox"> Usar textura</label></div>
<div class="textureControls"><div class="grid">
<div class="field"><label>Escala de textura %</label><input id="texScale" type="number" min="10" max="500" value="100"></div>
<div class="field"><label>Opacidad %</label><input id="texOpacity" type="number" min="0" max="100" value="90"></div>
<div class="field"><label>Posición horizontal %</label><input id="texX" type="number" min="0" max="100" value="50"></div>
<div class="field"><label>Posición vertical %</label><input id="texY" type="number" min="0" max="100" value="50"></div></div></div>
<button class="reset" onclick="resetDesign()">Restablecer diseño original</button></div></section>

<section class="hero" id="hero"><div class="eyebrow">Horas estimadas</div><div class="hoursrow"><input id="h" class="hours" type="number" min="0" max="300" step=".5" value="20" inputmode="decimal"><span class="unit">h</span></div><input id="slider" class="slider" type="range" min="0" max="200" step=".5" value="20"><div class="result"><div class="resultlabel">Mano de obra estimada</div><div id="labor" class="price">0 €</div><div id="rate" class="rate">0 €/h</div></div><div class="quick"><button class="q" onclick="setH(10)">10 h</button><button class="q" onclick="setH(20)">20 h</button><button class="q" onclick="setH(40)">40 h</button><button class="q" onclick="setH(80)">80 h</button></div></section>
<section class="section"><div class="sectiontitle">Costes adicionales</div><div class="card"><div class="grid"><div class="field"><label>Materiales</label><input id="mat" type="number" value="0"></div><div class="field"><label>Herrajes</label><input id="her" type="number" value="0"></div><div class="field"><label>Transporte</label><input id="tra" type="number" value="0"></div><div class="field"><label>Imprevistos %</label><input id="imp" type="number" value="5"></div></div><div class="total"><span>Precio estimado total</span><strong id="total">0 €</strong></div></div></section>
<section class="section"><div class="sectiontitle">Configuración interna</div><div class="card"><div class="grid"><div class="field"><label>Tarifa mínima €/h</label><input id="min" type="number" value="45"></div><div class="field"><label>Tarifa máxima €/h</label><input id="max" type="number" value="65"></div></div><div class="field" style="margin-top:12px"><label>Horas de referencia</label><input id="ref" type="number" value="80"></div></div></section><div class="note">Uso interno · Los valores se guardan automáticamente.</div>
</main><script>
const ids=["h","mat","her","tra","imp","min","max","ref","texScale","texOpacity","texX","texY"];const D=["brandIn","subIn","bgIn","cardIn","inkIn","heroIn","heroTextIn","radiusIn","fontIn","sizeIn","textureUse","texScale","texOpacity","texX","texY"];const E=x=>document.getElementById(x);
function euro(x){return new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(x)}
function calc(){let h=+E("h").value||0,min=+E("min").value||45,max=+E("max").value||65,ref=+E("ref").value||80,r=min+(max-min)*Math.exp(-h/(ref/2.3)),l=h*r;E("slider").value=Math.min(h,200);E("rate").textContent=r.toFixed(1)+" €/h";E("labor").textContent=euro(l);let b=l+(+E("mat").value||0)+(+E("her").value||0)+(+E("tra").value||0);E("total").textContent=euro(b*(1+(+E("imp").value||0)/100));ids.forEach(i=>localStorage.setItem("sasu_"+i,E(i).value))}
function design(){let s=document.documentElement.style;s.setProperty("--bg",E("bgIn").value);s.setProperty("--card",E("cardIn").value);s.setProperty("--ink",E("inkIn").value);s.setProperty("--hero",E("heroIn").value);s.setProperty("--heroText",E("heroTextIn").value);s.setProperty("--radius",E("radiusIn").value+"px");s.setProperty("--font",E("fontIn").value);s.setProperty("--textureSize",E("texScale").value+"%");s.setProperty("--textureX",E("texX").value+"%");s.setProperty("--textureY",E("texY").value+"%");s.setProperty("--textureOpacity",(+E("texOpacity").value||0)/100);E("brand").textContent=E("brandIn").value;E("subtitle").textContent=E("subIn").value;E("brand").style.fontSize=E("sizeIn").value+"px";let tex=localStorage.getItem("sasu_texture");if(tex)s.setProperty("--texture","url("+tex+")");E("hero").classList.toggle("texture",E("textureUse").checked&&!!tex);D.forEach(i=>localStorage.setItem("sasu_d_"+i,E(i).type==="checkbox"?E(i).checked:E(i).value))}
function load(){ids.forEach(i=>{let v=localStorage.getItem("sasu_"+i);if(v!==null)E(i).value=v});D.forEach(i=>{let v=localStorage.getItem("sasu_d_"+i);if(v!==null){if(E(i).type==="checkbox")E(i).checked=v==="true";else E(i).value=v}});let t=localStorage.getItem("sasu_texture");if(t)E("textureName").textContent="Textura de roble cargada";calc();design()}
function setH(v){E("h").value=v;calc()}function toggleCustom(){E("custom").classList.toggle("open")}function resetDesign(){localStorage.clear();location.reload()}
ids.forEach(i=>E(i).addEventListener("input",calc));D.forEach(i=>E(i).addEventListener("input",design));E("slider").addEventListener("input",()=>{E("h").value=E("slider").value;calc()});E("texture").addEventListener("change",e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{localStorage.setItem("sasu_texture",r.result);E("textureName").textContent=f.name;design()};r.readAsDataURL(f)});load();
</script></body></html>
